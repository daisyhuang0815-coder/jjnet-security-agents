name = "jjnet-security-worker"
main = "worker/worker.js"
compatibility_date = "2024-09-01"

# 預設後端環境變數
[vars]
AI_PROVIDER = "unieai"               # 可切換為 "unieai" 或 "gemini"
UNIEAI_BASE_URL = "https://api.unieai.com/v1"
UNIEAI_MODEL = "gemma-4-E4B-it"      # 依規格指定之模型
GEMINI_MODEL = "gemini-1.5-flash"

# 重要：機密金鑰不可在此檔案明文儲存！
# 請使用 Cloudflare CLI 進行加密寫入：
# 1. npx wrangler secret put UNIEAI_API_KEY
# 2. npx wrangler secret put GEMINI_API_KEY
